<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>サンプル旅館 こもれび庵｜架空施設の操作サンプル</title>
<meta name="description" content="Stay Conciergeの操作確認用サンプル。施設承認前の非公式試作・架空予約のみ。実送信や決済は行いません。">
<link rel="stylesheet" href="./app.css">
<script src="./meal-model.js" defer></script>
<script src="./meal-ui.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<div id="komorebi-stay" class="viz-dotted-background">
  <div class="sc-shell">
    <div class="sc-preview-label">サンプル旅館 こもれび庵 · 架空の施設・規定の設定例 · 実送信なし</div>
    <header class="sc-header">
      <div class="sc-brand">STAY CONCIERGE<span>GUEST CARE · KYOTO</span></div>
      <div class="sc-languages"><button type="button" data-language="ja" lang="ja" aria-label="日本語に切り替え" aria-pressed="true">日本語</button><button type="button" data-language="en" lang="en" aria-label="Switch to English" aria-pressed="false">EN</button></div>
    </header>
    <div class="sc-view-switch" aria-label="表示する画面">
      <button type="button" data-view="guest" aria-pressed="true">宿泊者の画面</button>
      <button type="button" data-view="admin" aria-pressed="false">宿側の画面</button>
    </div>
    <main class="sc-main" id="sc-main" aria-live="polite"></main>
    <footer class="sc-footer">Stay Concierge · 非公式試作 · 実際の宿泊者情報は入力しないでください</footer>
  </div>
</div>
<noscript><p>サンプル旅館 こもれび庵を題材にした非公式の試作です。操作を見るにはJavaScriptを有効にしてください。実際の宿への送信・予約・決済は行いません。</p></noscript>
</body>
</html>
